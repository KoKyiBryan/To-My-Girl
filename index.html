<!DOCTYPE html>
<html lang="my">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<meta name="theme-color"
content="#fff5f8">

<title>One Little Question ♡</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Myanmar",
        "Myanmar Text",
        sans-serif;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    color: #30242a;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(255,185,210,.55),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(255,215,230,.75),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #fff9fb,
            #ffedf4,
            #fff8fa
        );

    position: relative;
}


/* =========================================================
   BACKGROUND GLOW
========================================================= */

.glow {

    position: fixed;

    width: 330px;
    height: 330px;

    border-radius: 50%;

    filter: blur(85px);

    opacity: .4;

    pointer-events: none;

    animation:
        glowMove 8s ease-in-out infinite alternate;
}

.glow.one {

    background: #ffb8d0;

    top: -140px;
    left: -120px;
}

.glow.two {

    background: #ffcbdc;

    bottom: -150px;
    right: -120px;

    animation-delay: -3s;
}

@keyframes glowMove {

    from {
        transform: translate(0,0) scale(1);
    }

    to {
        transform: translate(25px,20px) scale(1.1);
    }
}


/* =========================================================
   MAIN WRAPPER
========================================================= */

.wrapper {

    width: min(92%, 430px);

    position: relative;

    z-index: 10;
}


/* =========================================================
   CARD
========================================================= */

.card {

    width: 100%;

    padding: 32px 24px 28px;

    border-radius: 30px;

    background:
        rgba(255,255,255,.78);

    border:
        1px solid rgba(255,255,255,.95);

    box-shadow:
        0 30px 80px rgba(143,61,91,.15),
        inset 0 1px 0 rgba(255,255,255,.9);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    overflow: hidden;

    position: relative;

    animation:
        cardEnter .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardEnter {

    from {
        opacity: 0;
        transform:
            translateY(30px)
            scale(.96);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   TOP LABEL
========================================================= */

.label {

    display: inline-flex;

    align-items: center;

    padding: 7px 13px;

    border-radius: 999px;

    background: #fff0f5;

    color: #c25a7e;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: .3px;

    margin-bottom: 18px;
}


/* =========================================================
   ICON
========================================================= */

.icon-box {

    width: 74px;
    height: 74px;

    margin: 0 auto 18px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 23px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #ffe8f0
        );

    box-shadow:
        0 12px 30px rgba(212,87,126,.15);

    animation:
        floating 3.5s ease-in-out infinite;
}

.icon {

    font-size: 35px;

    filter:
        drop-shadow(
            0 5px 8px
            rgba(215,75,120,.15)
        );
}

@keyframes floating {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}


/* =========================================================
   TITLES
========================================================= */

.title {

    font-size: 27px;

    line-height: 1.35;

    font-weight: 750;

    letter-spacing: -.5px;

    color: #35272d;

    margin-bottom: 9px;
}

.subtitle {

    color: #8b737c;

    font-size: 14px;

    line-height: 1.7;

    margin-bottom: 22px;
}


/* =========================================================
   QUESTION
========================================================= */

.question-box {

    padding: 20px 17px;

    border-radius: 21px;

    background:
        linear-gradient(
            135deg,
            rgba(255,245,248,.96),
            rgba(255,255,255,.88)
        );

    border:
        1px solid
        rgba(232,177,194,.22);

    margin-bottom: 16px;
}

.question {

    font-size: 20px;

    line-height: 1.6;

    font-weight: 700;

    color: #45343b;
}

.attempt {

    margin-top: 8px;

    color: #b3939e;

    font-size: 10px;

    letter-spacing: .4px;
}


/* =========================================================
   ANSWERS
========================================================= */

.answers {

    display: flex;

    flex-direction: column;

    gap: 9px;
}

.answer {

    width: 100%;

    min-height: 52px;

    border:
        1px solid
        rgba(220,170,190,.25);

    border-radius: 16px;

    background:
        rgba(255,255,255,.75);

    color: #5b454e;

    font-family: inherit;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease,
        border-color .2s ease;

    box-shadow:
        0 4px 12px
        rgba(100,50,70,.035);

    animation:
        buttonIn .3s ease;
}

@keyframes buttonIn {

    from {
        opacity: 0;
        transform: translateY(6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.answer:hover {

    transform: translateY(-2px);

    background: #fff4f8;

    border-color:
        rgba(218,111,148,.35);

    box-shadow:
        0 9px 22px
        rgba(180,75,110,.09);
}

.answer:active {

    transform: scale(.975);
}


/* =========================================================
   LOVE BUTTON
========================================================= */

.answer-love {

    margin-top: 2px;

    border: none;

    color: white;

    background:
        linear-gradient(
            135deg,
            #e96892,
            #c83e70
        );

    box-shadow:
        0 10px 25px
        rgba(200,62,112,.23);
}

.answer-love:hover {

    color: white;

    background:
        linear-gradient(
            135deg,
            #ed7299,
            #c83e70
        );

    box-shadow:
        0 14px 30px
        rgba(200,62,112,.28);
}


/* =========================================================
   RETRY MESSAGE
========================================================= */

.retry {

    min-height: 27px;

    margin-top: 14px;

    color: #c45b7e;

    font-size: 13px;

    line-height: 1.6;

    opacity: 0;

    transform: translateY(5px);

    transition:
        opacity .3s ease,
        transform .3s ease;
}

.retry.show {

    opacity: 1;

    transform: translateY(0);
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    margin-top: 21px;

    color: #b69da6;

    font-size: 10px;

    letter-spacing: .3px;

    text-align: center;
}


/* =========================================================
   FINAL SCREEN
========================================================= */

.final {

    display: none;

    text-align: center;

    animation:
        finalEnter .8s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes finalEnter {

    from {
        opacity: 0;
        transform:
            scale(.92)
            translateY(15px);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
    }
}

.final-heart {

    font-size: 62px;

    margin-bottom: 14px;

    animation:
        heartbeat 1.2s
        ease-in-out infinite;
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.13);
    }
}

.final-title {

    font-size: 28px;

    color: #c94172;

    margin-bottom: 15px;
}

.final-message {

    color: #554149;

    font-size: 18px;

    line-height: 1.8;

    font-weight: 650;

    margin-bottom: 14px;
}

.final-small {

    color: #9a8089;

    font-size: 13px;

    line-height: 1.8;
}


/* =========================================================
   SHAKE
========================================================= */

.shake {

    animation:
        shake .4s ease;
}

@keyframes shake {

    0%,100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-5px);
    }

    75% {
        transform: translateX(5px);
    }
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.floating-heart {

    position: fixed;

    bottom: -30px;

    z-index: 3;

    pointer-events: none;

    opacity: 0;

    font-size: 18px;

    animation:
        floatHeart
        5s linear forwards;
}

@keyframes floatHeart {

    0% {

        transform:
            translateY(0)
            rotate(0deg)
            scale(.8);

        opacity: 0;
    }

    15% {
        opacity: .75;
    }

    100% {

        transform:
            translateY(-110vh)
            rotate(25deg)
            scale(1.2);

        opacity: 0;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-height: 700px) {

    .card {
        padding-top: 22px;
        padding-bottom: 20px;
    }

    .icon-box {
        width: 62px;
        height: 62px;
        margin-bottom: 11px;
    }

    .icon {
        font-size: 29px;
    }

    .title {
        font-size: 23px;
    }

    .question {
        font-size: 18px;
    }

    .answer {
        min-height: 46px;
    }
}

</style>

</head>


<body>


<!-- BACKGROUND -->

<div class="glow one"></div>
<div class="glow two"></div>


<div class="wrapper">

<div class="card" id="card">


<!-- =====================================================
     QUESTION SCREEN
===================================================== -->

<section id="quizScreen">


    <div class="label">
        ♡ A LITTLE QUESTION
    </div>


    <div class="icon-box">

        <div class="icon">
            💌
        </div>

    </div>


    <h1 class="title">
        မေးစရာလေးရှိတယ်...
    </h1>


    <p class="subtitle">
        အများကြီးမစဉ်းစားနဲ့နော်။<br>
        အမှန်အတိုင်းပဲ ဖြေပေး 👀
    </p>


    <div class="question-box">

        <div class="question">
            ဒီညစောစောအိပ်မှာလား
        </div>

        <div
            class="attempt"
            id="attemptText">

            ONE LITTLE QUESTION · 0 / 5

        </div>

    </div>


    <!-- WRONG ANSWERS -->

    <div
        class="answers"
        id="answers">


        <button
            class="answer wrong-answer"
            onclick="wrongAnswer('အိပ်မယ်')">

            အိပ်မယ်

        </button>


        <button
            class="answer wrong-answer"
            onclick="wrongAnswer('မအိပ်ဘူး')">

            မအိပ်ဘူး

        </button>


        <button
            class="answer wrong-answer"
            onclick="wrongAnswer('မသိဘူး')">

            မသိဘူး

        </button>


        <button
            class="answer wrong-answer"
            onclick="wrongAnswer('မပြောပြဘူး')">

            မပြောပြဘူး

        </button>


    </div>


    <!-- LOVE -->

    <button
        class="answer answer-love"
        id="loveButton"
        onclick="loveAnswer()">

        ချစ်တယ် ❤️

    </button>


    <div
        class="retry"
        id="retryMessage">
    </div>


    <div class="footer">
        made with a little bit of courage ♡
    </div>


</section>


<!-- =====================================================
     FINAL SCREEN
===================================================== -->

<section
    class="final"
    id="finalScreen">


    <div class="final-heart">
        ❤️
    </div>


    <h2 class="final-title">
        အဲ့ဒါဆို...
    </h2>


    <p class="final-message">
        ချစ်တယ်လို့တော့<br>
        ပြောပြီနော် 🥹❤️
    </p>


    <p class="final-small">
        ဒီည စောစောအိပ်ဖို့တော့<br>
        မမေးတော့ဘူး 😌
    </p>


    <div class="footer">
        good night, MaMa ♡
    </div>


</section>


</div>

</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyi3eXW94iKwyHmE9ijqL7nJ7JsQjirPo14tJRdpYmVxwk6m4-8NPID2yMfuweHyrZU/exec";


/* =========================================================
   VARIABLES
========================================================= */

let attempts = 0;


/* =========================================================
   RETRY MESSAGES
========================================================= */

const retryMessages = [

    "အဲ့ဒါလည်း မဟုတ်သေးဘူးနော်... ထပ်ရွေးကြည့် 👀",

    "Hmm... အဖြေ မှားနေတယ်ထင်တယ် 😂",

    "သေချာစဉ်းစားပြီး ထပ်ရွေးပေးဦး ❤️",

    "နောက်ဆုံးတစ်ခါနော်... 👀",

    "၅ ကြိမ်တောင်ပြည့်ပြီ... ဘာကိုရွေးရမလဲ သိပြီမလား 😏❤️"

];


/* =========================================================
   RANDOMIZE WRONG ANSWERS
========================================================= */

function shuffleAnswers() {

    const container =
        document.getElementById("answers");

    const buttons =
        Array.from(
            container.querySelectorAll(
                ".wrong-answer"
            )
        );


    /*
       Fisher-Yates shuffle
    */

    for (
        let i = buttons.length - 1;
        i > 0;
        i--
    ) {

        const random =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            buttons[i],
            buttons[random]
        ] =
        [
            buttons[random],
            buttons[i]
        ];

    }


    /*
       Put them back
       in random order
    */

    buttons.forEach(
        (button, index) => {

            button.style.animation = "none";

            void button.offsetWidth;

            button.style.animation =
                `buttonIn .3s ease ${index * .04}s`;

            container.appendChild(button);

        }
    );

}


/* =========================================================
   WRONG ANSWER
========================================================= */

function wrongAnswer(answer) {

    attempts++;


    /*
       Send answer
       to Google Sheet
    */

    sendAnswer(
        answer,
        attempts
    );


    const card =
        document.getElementById("card");

    const message =
        document.getElementById(
            "retryMessage"
        );

    const attemptText =
        document.getElementById(
            "attemptText"
        );


    /*
       Shake animation
    */

    card.classList.remove(
        "shake"
    );

    void card.offsetWidth;

    card.classList.add(
        "shake"
    );


    /*
       Retry message
    */

    const index =
        Math.min(
            attempts - 1,
            retryMessages.length - 1
        );


    message.innerText =
        retryMessages[index];


    message.classList.remove(
        "show"
    );

    void message.offsetWidth;

    message.classList.add(
        "show"
    );


    /*
       Counter
    */

    if (attempts < 5) {

        attemptText.innerText =
            `ONE LITTLE QUESTION · ${attempts} / 5`;

    } else {

        attemptText.innerText =
            `ONE LITTLE QUESTION · ${attempts} TIMES`;

    }


    /*
       🔀 RANDOMIZE ANSWERS
    */

    shuffleAnswers();


    /*
       Hearts
    */

    createHeartBurst(3);

}


/* =========================================================
   LOVE ANSWER
========================================================= */

function loveAnswer() {

    attempts++;


    /*
       Send final answer
    */

    sendAnswer(
        "ချစ်တယ် ❤️",
        attempts
    );


    const quiz =
        document.getElementById(
            "quizScreen"
        );

    const final =
        document.getElementById(
            "finalScreen"
        );


    /*
       Fade out
    */

    quiz.style.opacity = "0";

    quiz.style.transform =
        "translateY(-10px)";

    quiz.style.transition =
        "all .45s ease";


    setTimeout(() => {

        quiz.style.display =
            "none";

        final.style.display =
            "block";


        /*
           BIG HEART BURST
        */

        createHeartBurst(30);


    }, 450);

}


/* =========================================================
   SEND ANSWER TO GOOGLE SHEET
========================================================= */

function sendAnswer(
    answer,
    attempt
) {

    const data = {

        answer: answer,

        attempt: attempt,

        device:
            navigator.userAgent

    };


    fetch(
        GOOGLE_SCRIPT_URL,
        {

            method: "POST",

            mode: "no-cors",

            headers: {

                "Content-Type":
                    "text/plain;charset=utf-8"

            },

            body:
                JSON.stringify(data)

        }
    )

    .catch(error => {

        console.log(
            "Response error:",
            error
        );

    });

}


/* =========================================================
   FLOATING HEART
========================================================= */

function createHeart() {

    const heart =
        document.createElement(
            "div"
        );


    heart.className =
        "floating-heart";


    const symbols = [

        "♡",
        "♥",
        "❤",
        "💗",
        "💕",
        "💖",
        "✨"

    ];


    heart.innerText =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


    heart.style.left =
        Math.random() *
        100 +
        "vw";


    heart.style.fontSize =
        (
            13 +
            Math.random() * 15
        ) +
        "px";


    heart.style.animationDuration =
        (
            4 +
            Math.random() * 3
        ) +
        "s";


    document.body.appendChild(
        heart
    );


    setTimeout(
        () => {

            heart.remove();

        },
        7500
    );

}


/* =========================================================
   HEART BURST
========================================================= */

function createHeartBurst(
    amount
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        setTimeout(
            createHeart,
            i * 90
        );

    }

}


/* =========================================================
   BACKGROUND HEARTS
========================================================= */

setInterval(
    () => {

        if (
            Math.random() > .35
        ) {

            createHeart();

        }

    },
    1800
);

</script>

</body>

</html>
